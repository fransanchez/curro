# Gradle properties for Curro Android project.
# See https://docs.gradle.org/current/userguide/build_environment.html

# Enable AndroidX (required for all modern Android libraries)
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only
# the resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Gradle daemon and build performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable configuration cache for faster builds
org.gradle.configuration-cache=false

# Parallel builds
org.gradle.parallel=true
