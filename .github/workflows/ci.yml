name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Curro uses Firebase (Crashlytics + Analytics). Store google-services.json
      # base64-encoded as the GOOGLE_SERVICES_JSON repo secret. Until that secret
      # exists (and the app/ module is generated), this step no-ops so CI still runs.
      - name: Decode google-services.json
        if: ${{ hashFiles('app/build.gradle.kts') != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON secret not set — skipping."
          fi

      - name: Lint (ktlint + detektDebug)
        # detektDebug (not plain detekt) runs the type-resolved analyses too,
        # so rules like UnsafeCallOnNullableType (`!!`) actually fire in CI.
        # Plain `detekt` skips them — see docs/briefs/US-003 + the chore that
        # surfaced this gap during US-008 verification.
        run: ./gradlew ktlintCheck detektDebug

      - name: Build debug
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          retention-days: 14
